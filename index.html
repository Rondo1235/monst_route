-size:15px}.fineprint{text-align:center;color:#72839a;font-size:10px;margin:10px 0 0}.editrow{margin-top:10px}.editrow summary{font-size:12px;color:#9fb0c6;cursor:pointer;padding:7px 1px}.editopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editopts select,.editopts button{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#172438;color:var(--white)}.sizeCtl{margin-top:10px}.sizeCtl label{display:flex;justify-content:space-between;color:#aebbd0;font-size:12px}.sizeCtl output{color:var(--mint)}.sizeCtl input{width:100%;accent-color:var(--mint)}.editToggle{display:block;width:100%;margin-top:14px;padding:13px;border:1px solid #66cdbc;border-radius:12px;background:#142a38;color:var(--mint);font-weight:800;font-size:14px;text-align:left;cursor:pointer}.editPanel{margin-top:8px;padding:12px;background:#101b2b;border:1px solid #2b4058;border-radius:12px}.editPanel[hidden]{display:none}.editHint{font-size:11px;color:#a8b8cb;margin:0 0 10px}.editopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editopts select,.editopts button{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#172438;color:var(--white)}.sizeCtl{margin-top:10px}.sizeCtl label{display:flex;justify-content:space-between;color:#aebbd0;font-size:12px}.sizeCtl output{color:var(--mint)}.sizeCtl input{width:100%;accent-color:var(--mint)}.sizeList{margin-top:10px;display:grid;gap:7px}.sizeRow{padding:8px 9px;background:#172438;border:1px solid #2a3b53;border-radius:9px}.sizeRow label{display:flex;justify-content:space-between;color:#dce7f2;font-size:12px}.sizeRow output{color:var(--mint)}.sizeRow input{width:100%;accent-color:#f26e88}.sizeEmpty{font-size:11px;color:#8293a9;padding:7px 2px}@media(max-width:440px){.app{padding:8px 10px}.title{font-size:16px}.head{gap:6px}.head button,.upload{padding:10px 9px;font-size:12px}.canvaswrap{width:min(100%,400px)}.modes{gap:5px}.mode{font-size:12px;padding:11px 3px}.toolrow{gap:5px}.toolrow button{fo </style></head><body><main class="app">
<header class="head"><div class="brandTitle"><img class="appIcon" src="./app-icon.svg" alt=""><div><div class="title">モンスト <span>壁反射ガイド</span></div><div class="sub">角度と壁位置を調整</div></div></div><button id="fit" aria-pressed="true">全体表示ON</button><label class="upload add">＋ 画像<input id="file" type="file" accept="image/*"></label></header>
<section class="frame"><div class="canvaswrap"><canvas id="board" width="600" height="900"></canvas><div class="readout" id="readout">発射点をタップ ・ 角度 52.7° ・ 反射 8回</div></div></section>
<nav class="modes"><button class="mode" data-mode="start">◎ 発射点</button><button class="mode active" data-mode="angle">↗ 角度</button><button class="mode" data-mode="wall">□ 壁の位置</button></nav><div class="help" id="help">角度モード：盤面をタップまたはドラッグして設定</div>
<div class="angleline"><input id="angle" type="range" min="0" max="3600" value="527"><div class="angleval"><span id="angleText">52.7</span>°</div></div><div class="adjust"><button data-step="-10">−1°</button><button data-step="-1">−0.1°</button><button data-step="1">＋0.1°</button><button data-step="10">＋1°</button></div><button id="fire" class="fire">軌道を解析して発射</button>
<div class="divider"></div><div class="sectionlabel">壁の点線を表示</div><div class="toolrow"><button id="dots" class="on">幅 ON</button><select id="bounce" aria-label="反射回数" class="countSelect"><option value="1">反射回数 1回</option><option value="2">反射回数 2回</option><option value="3">反射回数 3回</option><option value="4" selected>反射回数 4回</option><option value="5">反射回数 5回</option><option value="6">反射回数 6回</option><option value="7">反射回数 7回</option><option value="8">反射回数 8回</option><option value="9">反射回数 9回</option><option value="10">反射回数 10回</option><option value="11">反射回数 11回</option><option value="12">反射回数 12回</option><option value="13">反射回数 13回</option><option value="14">反射回数 14回</option><option value="15">反射回数 15回</option><option value="16">反射回数 16回</option><option value="17">反射回数 17回</option><option value="18">反射回数 18回</option><option value="19">反射回数 19回</option><option value="20">反射回数 20回</option></select><button id="save">一時保存する</button><button id="line" class="on">壁線 ON</button></div><button id="wallLock" class="wallLockButton" aria-pressed="false">壁サイズ固定 OFF</button>
<div class="bottomgrid"><div class="box"><label>ショットタイプ</label><select id="shotType"><option value="reflect">反射タイプ</option><option value="pierce">貫通タイプ</option></select></div><div class="box"><label>壁線の色</label><select id="lineColor"><option value="#ffd84d">線：黄</option><option value="#101820">線：黒</option><option value="#f6ffff">線：白</option><option value="#76e4d1">線：ミント</option></select></div></div>
<div class="results"><div class="result"><small>敵ヒット数</small><b id="hits">—</b></div><div class="result"><small id="bounceLabel">反射回数</small><b id="bounces">—</b></div><div class="result"><small>状態</small><b id="state">待機中</b></div></div>
<button id="editToggle" class="editToggle" aria-expanded="false">✎ 盤面を編集（敵・味方・ブロック）</button><section id="editPanel" class="editPanel" hidden><p class="editHint">編集モードを選んで盤面をタップ。配置した敵は下のスライダーで一体ずつサイズ変更できます。</p><div class="editopts"><select id="editMode"><option value="move">マーカーを移動</option><option value="enemy">敵を追加</option><option value="ally">味方を追加</option><option value="block">正方形ブロックを追加</option><option value="erase">マーカーを削除</option></select><button id="reset">マーカーをすべて消す</button></div><div class="sizeList" id="enemySizes"></div><div class="sizeCtl"><label>ブロックの大きさ <output id="blockSizeText">48 px</output></label><input id="blockSize" type="range" min="24" max="96" value="48"></div></section>
<p class="fineprint">画像はこの端末内で表示します。軌道は簡易シミュレーションによる目安です。</p></main>
<script>
(()=>{const c=document.querySelector('#board'),g=c.getContext('2d'),$=id=>document.getElementById(id);let angle=52.7,bg=null,fit='contain',wallSizeLocked=false,mode='angle',start={x:105,y:705},wall={l:18,t:70,r:582,b:770},maxB=4,blockScale=100,showDots=true,showLine=true,shot='reflect',route=[],drag=null,backgroundName='';const E=[],A=[];let B=[];function sync(){ $('angle').value=Math.round(angle*10);$('angleText').textContent=angle.toFixed(1);$('bounce').value=String(maxB);analyze() }function orb(o,color,label){g.save();g.fillStyle=color;g.shadowColor=color;g.shadowBlur=8;g.beginPath();g.arc(o.x,o.y,o.r,0,Math.PI*2);g.fill();g.shadowBlur=0;g.fillStyle='#101820';g.font='bold 14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(label,o.x,o.y);g.restore()}function enemyMark(o){g.save();g.shadowColor='#f26e88';g.shadowBlur=8;g.fillStyle='#f26e88';g.beginPath();g.roundRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2,4);g.fill();g.shadowBlur=0;g.strokeStyle='#ffd7df';g.lineWidth=2;g.stroke();g.fillStyle='#101820';g.font='bold 14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('敵',o.x,o.y);g.restore()}function renderEnemySizes(){let box=$('enemySizes');if(!box)return;if(!E.length){box.innerHTML='<div class="sizeEmpty">敵マーカーはありません。「敵を追加」を選んで盤面をタップしてください。</div>';return}box.innerHTML=E.map((o,i)=>'<div class="sizeRow"><label>敵 '+(i+1)+'<output>'+Math.round(o.r*2)+' px</output></label><input type="range" min="24" max="96" step="2" value="'+Math.round(o.r*2)+'" data-enemy="'+i+'"></div>').join('');box.querySelectorAll('input[data-enemy]').forEach(input=>input.oninput=()=>{let o=E[+input.dataset.enemy];if(!o)return;o.r=+input.value/2;input.previousElementSibling.querySelector('output').textContent=input.value+' px';route=[];draw()})}function draw(){g.clearRect(0,0,600,900);g.fillStyle='#15202b';g.fillRect(0,0,600,900);if(bg){let s=fit==='contain'?Math.min(600/bg.width,900/bg.height):Math.max(600/bg.width,900/bg.height),w=bg.width*s,h=bg.height*s;g.drawImage(bg,(600-w)/2,(900-h)/2,w,h);g.fillStyle='#06101a24';g.fillRect(0,0,600,900)}else{g.fillStyle='#b3c76a';g.fillRect(0,0,600,900);g.fillStyle='#c4d87c';g.fillRect(wall.l,wall.t,wall.r-wall.l,wall.b-wall.t);for(let i=0;i<60;i++){let x=wall.l+((i*97)%Math.max(1,wall.r-wall.l)),y=wall.t+((i*137)%Math.max(1,wall.b-wall.t));g.fillStyle=i%2?'#a6bd5a':'#d0db8b';g.beginPath();g.arc(x,y,5+i%7,0,7);g.fill()}}g.fillStyle='#07101a55';g.fillRect(wall.l,wall.t,wall.r-wall.l,wall.b-wall.t);if(showLine){g.strokeStyle=$('lineColor').value;g.lineWidth=3;g.setLineDash(showDots?[5,5]:[]);g.strokeRect(wall.l,wall.t,wall.r-wall.l,wall.b-wall.t);g.setLineDash([])}if(mode==='wall'){g.fillStyle=wallSizeLocked?'#8292a8':'#80e4d0';[[wall.l,wall.t],[wall.r,wall.t],[wall.l,wall.b],[wall.r,wall.b]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],8,0,7);g.fill()})}B.forEach(o=>{g.fillStyle='#43566d';g.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);g.strokeStyle='#b8c9dc';g.lineWidth=2;g.strokeRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)});A.forEach((o,i)=>orb(o,'#ffd15f',['1','2','3','4'][i%4]));E.forEach(o=>enemyMark(o));if(route.length){g.strokeStyle='#80e4d0';g.globalAlpha=.86;g.lineWidth=3;g.beginPath();route.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.globalAlpha=1}if(showDots&&route.length){route.filter((_,i)=>i%8===0).forEach(p=>{g.fillStyle='#effffb';g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()})}let a=angle*Math.PI/180;g.strokeStyle='#eafffb';g.lineWidth=2;g.setLineDash([7,6]);g.beginPath();g.moveTo(start.x,start.y);g.lineTo(start.x+Math.cos(a)*95,start.y-Math.sin(a)*95);g.stroke();g.setLineDash([]);orb({...start,r:12},'#111820','');g.strokeStyle='#9df2df';g.lineWidth=3;g.beginPath();g.arc(start.x,start.y,16,0,7);g.stroke()}function analyze(){let a=angle*Math.PI/180,dx=Math.cos(a),dy=-Math.sin(a),x=start.x,y=start.y,points=[{x,y}],hits=new Set(),contacts=new Set(),hitEvents=0,b=0,passes=0,steps=1500,radius=12;for(let i=0;i<steps;i++){let priorB=b,priorPasses=passes,wallHit=false;let nx=x+
